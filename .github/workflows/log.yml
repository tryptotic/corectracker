name: Log CoRec counts

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: corec-log

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python log_counts.py
      - name: Commit new data
        run: |
          git config user.name "corec-logger"
          git config user.email "actions@users.noreply.github.com"
          git add data/counts.csv
          git diff --cached --quiet || (git commit -m "log $(date -u +%FT%TZ)" && git push)
